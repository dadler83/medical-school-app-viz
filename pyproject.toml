[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-school-app-viz"
version = "0.1.0"
description = "PDF parsing and image-to-text replacement utilities for medical school admissions documents."
requires-python = ">=3.9"
dependencies = [
    "PyPDF2>=3.0.0",
]
